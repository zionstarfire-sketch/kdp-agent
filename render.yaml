services:
  - type: web
    name: kdp-agent
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 7860
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
